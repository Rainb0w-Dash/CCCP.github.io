<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Player & Visualizer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121214;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
        }

        .player-container {
            background: #1e1e24;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 90%;
            max-width: 500px;
            z-index: 10;
        }

        h2 {
            margin-bottom: 20px;
            font-size: 1.5rem;
            letter-spacing: 1px;
        }

        audio {
            width: 100%;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        /* Canvas container styles */
        .visualizer-container {
            width: 100%;
            height: 150px;
            background: #131316;
            border-radius: 12px;
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <h2>Now Playing</h2>
        
        <!-- Standard HTML Audio Player -->
        <audio id="audio" controls src="your-audio-file.mp3"></audio>
        
        <!-- Canvas where the visualizer is drawn -->
        <div class="visualizer-container">
            <canvas id="visualizer"></canvas>
        </div>
    </div>

    <script src="player.js"></script>
</body>
</html>
